name: release
on:
  push:
    branches:
      - spin-seq
    paths:
      - 'version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [seeed_xiao_esp32s3, seeed_xiao_master]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python3 -m pip install platformio cryptography

      - name: Build firmware (${{ matrix.env }})
        run: platformio run -e "${{ matrix.env }}"

      - name: Archive firmware binaries (${{ matrix.env }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            build/release/*${{ matrix.env }}*
          retention-days: 1

      - name: Archive merged firmware binaries (${{ matrix.env }})
        uses: actions/upload-artifact@v4
        with:
          name: merged-firmware-${{ matrix.env }}
          path: |
            build/merged/*${{ matrix.env }}*
          retention-days: 1

  release:
    name: Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo for CHANGELOG
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Tag version
        id: tagversion
        uses: salsify/action-detect-and-tag-new-version@v2
        with:
          version-command: |
            cat version.txt

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware
      
      - name: Download merged firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: merged-firmware-*
          merge-multiple: true
          path: merged-firmware
      
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagversion.outputs.current-version }}
          generate_release_notes: true
          files: |
            firmware/*
            merged-firmware/*